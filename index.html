<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТДР-26 МГРИ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 0;
            user-select: none;
        }

        .user-status-bar {
            background: #1e293b;
            color: #94a3b8;
            padding: 8px 12px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .status-badge {
            background: #334155;
            color: #f8fafc;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .status-badge.admin { background: #16a34a; color: #fff; }

        .tabs {
            display: flex;
            background: #1e1e1e;
            padding: 6px;
            gap: 4px;
            border-bottom: 1px solid #2d2d2d;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 4px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #888;
            transition: all 0.2s;
        }
        .tab.active {
            background: #2563eb;
            color: #ffffff;
        }

        .content {
            padding: 16px;
            display: none;
        }
        .content.active {
            display: block;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        select {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #3d3d3d;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }

        .card {
            background: #1e1e1e;
            border: 1px solid #2e2e2e;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f3f4f6;
            font-size: 15px;
        }
        .deadline-badge {
            background: #3b82f622;
            color: #60a5fa;
            border: 1px solid #3b82f644;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .card-body {
            font-size: 14px;
            line-height: 1.4;
            color: #d1d5db;
            white-space: pre-wrap;
            margin-top: 6px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #3d3d3d;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 14px;
            outline: none;
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-toggle {
            background: #334155;
            color: #cbd5e1;
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-danger {
            background: #dc2626;
            margin-top: 10px;
            padding: 6px 12px;
            width: auto;
            font-size: 12px;
        }

        .admin-zone {
            display: none;
            background: #1e293b;
            padding: 14px;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px dashed #f59e0b;
        }
        .admin-zone h3 {
            margin-top: 0;
            font-size: 14px;
            color: #f59e0b;
            margin-bottom: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: #1e1e1e;
            padding: 20px;
            width: 85%;
            max-width: 340px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #3d3d3d;
            margin: auto;
        }
        .log-item {
            font-size: 12px;
            border-bottom: 1px solid #2a2a2a;
            padding: 8px 0;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <!-- Шапка статуса -->
    <div class="user-status-bar">
        <span>ID: <strong id="debug-user-id">Определяется...</strong></span>
        <span id="debug-role-badge" class="status-badge">Загрузка...</span>
    </div>

    <!-- Навигация без расписания -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('hw', this)">Общее ДЗ</div>
        <div class="tab" onclick="switchTab('session', this)">Сессия</div>
        <div class="tab" onclick="switchTab('logs', this)">Логи</div>
    </div>

    <!-- Вкладка: Общее ДЗ -->
    <div id="hw" class="content active">
        <div class="controls-bar">
            <!-- Сортировка -->
            <select id="hw-sort" onchange="loadHW()">
                <option value="asc">⏳ Сначала ближайшие</option>
                <option value="desc">⏳ Сначала дальние</option>
            </select>
            <!-- Кнопка скрытия панели редактора -->
            <button id="toggle-editor-btn" class="btn-toggle" style="display:none;" onclick="toggleEditorPanel()">👁️ Скрыть панель</button>
        </div>

        <div id="hw-list">Загрузка...</div>

        <!-- Панель добавления ДЗ -->
        <div id="admin-add-hw" class="admin-zone">
            <h3>➕ Панель редактора (Добавить ДЗ)</h3>
            <input type="text" id="hw-subject" placeholder="Предмет (например: Высшая математика)">
            <input type="text" id="hw-deadline" placeholder="Срок сдачи (ДД.ММ.ГГГГ)" value="25.09.2026">
            <textarea id="hw-desc" placeholder="Описание задания / параграф / задачи"></textarea>
            <button class="btn" onclick="askConfirmAdd('dz')">Сохранить задание</button>
        </div>
    </div>

    <!-- Вкладка: Сессия -->
    <div id="session" class="content">
        <h2>🎓 Зачеты и экзамены</h2>
        <div id="session-list">Загрузка...</div>

        <div id="admin-add-session" class="admin-zone">
            <h3>➕ Добавить экзамен / зачет</h3>
            <input type="text" id="session-subject" placeholder="Предмет">
            <input type="text" id="session-deadline" placeholder="Дата экзамена (ДД.ММ.ГГГГ)">
            <textarea id="session-desc" placeholder="Кабинет, время, требования"></textarea>
            <button class="btn" onclick="askConfirmAdd('session')">Сохранить в сессию</button>
        </div>
    </div>

    <!-- Вкладка: Логи -->
    <div id="logs" class="content">
        <h2>📜 История действий (Audit Log)</h2>
        <div id="logs-list">Загрузка логов...</div>
    </div>

    <!-- Модальное окно -->
    <div id="confirmModal" class="modal">
        <div class="modal-box">
            <h3 style="margin-bottom: 8px;">⚠️ Подтверждение</h3>
            <p id="modal-text" style="font-size: 14px; color: #ccc;">Вы уверены?</p>
            <div style="display:flex; gap:10px; margin-top:16px;">
                <button class="btn" onclick="executePendingAction()">Да</button>
                <button class="btn btn-danger" style="margin-top:0; width:100%;" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BACKEND_URL = "https://tdr26-backend.onrender.com"; 

        const userId = tg.initDataUnsafe?.user?.id || 123456789;
        const username = tg.initDataUnsafe?.user?.username || tg.initDataUnsafe?.user?.first_name || "student";

        let canEdit = false;
        let pendingAction = null;
        let isPanelVisible = true;

        document.getElementById('debug-user-id').innerText = userId;

        async function init() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/user_info?user_id=${userId}`);
                if (res.ok) {
                    const data = await res.json();
                    canEdit = data.can_edit;
                    
                    const badge = document.getElementById('debug-role-badge');
                    badge.innerText = data.role.toUpperCase();
                    if (canEdit) {
                        badge.classList.add('admin');
                        document.querySelectorAll('.admin-zone').forEach(el => el.style.display = 'block');
                        document.getElementById('toggle-editor-btn').style.display = 'inline-block';
                    }
                } else {
                    document.getElementById('debug-role-badge').innerText = "VIEWER";
                }
            } catch(e) {
                console.error("Ошибка подключения:", e);
                document.getElementById('debug-role-badge').innerText = "OFFLINE";
            }

            loadHW();
            loadSession();
            loadLogs();
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        function toggleEditorPanel() {
            isPanelVisible = !isPanelVisible;
            document.querySelectorAll('.admin-zone').forEach(el => {
                el.style.display = isPanelVisible ? 'block' : 'none';
            });
            document.getElementById('toggle-editor-btn').innerText = isPanelVisible ? '👁️ Скрыть панель' : '✏️ Показать панель';
        }

        // Вспомогательная функция парсинга даты "ДД.ММ.ГГГГ" для сортировки
        function parseDate(str) {
            if (!str) return new Date(0);
            const parts = str.split('.');
            if (parts.length === 3) {
                return new Date(parts[2], parts[1] - 1, parts[0]);
            }
            return new Date(str);
        }

        // Загрузка и сортировка ДЗ
        async function loadHW() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/homework?type=dz`);
                let data = await res.json();
                
                const sortOrder = document.getElementById('hw-sort').value;
                data.sort((a, b) => {
                    const dateA = parseDate(a[2]);
                    const dateB = parseDate(b[2]);
                    return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
                });

                let html = '';
                if (data.length === 0) {
                    html = '<div style="color:#888; text-align:center; padding:20px;">Заданий пока нет</div>';
                } else {
                    data.forEach(item => {
                        html += `<div class="card">
                            <div class="card-header">
                                <span>📚 ${item[1]}</span>
                                <span class="deadline-badge">⏳ Срок: ${item[2]}</span>
                            </div>
                            <div class="card-body">${item[3]}</div>
                            ${canEdit ? `<button class="btn btn-danger" onclick="askConfirmDelete(${item[0]})">Удалить</button>` : ''}
                        </div>`;
                    });
                }
                document.getElementById('hw-list').innerHTML = html;
            } catch(e) {
                document.getElementById('hw-list').innerHTML = '<div style="color:#ef4444;">Ошибка загрузки ДЗ</div>';
            }
        }

        async function loadSession() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/homework?type=session`);
                const data = await res.json();
                let html = '';
                if (data.length === 0) {
                    html = '<div style="color:#888; text-align:center; padding:20px;">Информация о сессии не добавлена</div>';
                } else {
                    data.forEach(item => {
                        html += `<div class="card">
                            <div class="card-header">
                                <span>🎓 ${item[1]}</span>
                                <span class="deadline-badge">📅 ${item[2]}</span>
                            </div>
                            <div class="card-body">${item[3]}</div>
                            ${canEdit ? `<button class="btn btn-danger" onclick="askConfirmDelete(${item[0]})">Удалить</button>` : ''}
                        </div>`;
                    });
                }
                document.getElementById('session-list').innerHTML = html;
            } catch(e) {
                document.getElementById('session-list').innerHTML = 'Ошибка загрузки сессии';
            }
        }

        async function loadLogs() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/logs?user_id=${userId}`);
                if (!res.ok) {
                    document.getElementById('logs-list').innerHTML = '<div style="color:#888;">Просмотр логов доступен только участникам</div>';
                    return;
                }
                const data = await res.json();
                let html = '';
                data.forEach(l => {
                    html += `<div class="log-item"><strong>@${l[0]}</strong>: ${l[1]} <br><span style="color:#666; font-size:10px;">${l[2]}</span></div>`;
                });
                document.getElementById('logs-list').innerHTML = html || 'Логи пусты';
            } catch(e) {
                document.getElementById('logs-list').innerHTML = 'Ошибка загрузки логов';
            }
        }

        function askConfirmAdd(type) {
            const prefix = type === 'dz' ? 'hw' : 'session';
            const subject = document.getElementById(`${prefix}-subject`).value;
            const deadline = document.getElementById(`${prefix}-deadline`).value;
            const description = document.getElementById(`${prefix}-desc`).value;

            if (!subject || !deadline || !description) {
                alert("Заполните все поля!");
                return;
            }

            pendingAction = async () => {
                await fetch(`${BACKEND_URL}/api/homework/add`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ subject, deadline, description, type, user_id: userId, username })
                });
                document.getElementById(`${prefix}-subject`).value = '';
                document.getElementById(`${prefix}-desc`).value = '';
                if (type === 'dz') loadHW(); else loadSession();
                loadLogs();
            };

            document.getElementById('modal-text').innerText = `Добавить ${type === 'dz' ? 'ДЗ' : 'экзамен'} по предмету "${subject}"?`;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function askConfirmDelete(hwId) {
            pendingAction = async () => {
                await fetch(`${BACKEND_URL}/api/homework/delete`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ hw_id: hwId, user_id: userId, username })
                });
                loadHW();
                loadSession();
                loadLogs();
            };
            document.getElementById('modal-text').innerText = "Удалить эту запись?";
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function executePendingAction() {
            if (pendingAction) pendingAction();
            closeModal();
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
