<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТДР-26 МГРИ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 0;
            user-select: none;
        }

        .user-status-bar {
            background: #1e293b;
            color: #94a3b8;
            padding: 8px 12px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        .status-badge {
            background: #334155;
            color: #f8fafc;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .status-badge.admin { background: #16a34a; color: #fff; }
        .status-badge.editor { background: #2563eb; color: #fff; }

        .tabs {
            display: flex;
            background: #1e1e1e;
            padding: 6px;
            gap: 4px;
            border-bottom: 1px solid #2d2d2d;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 4px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            color: #888;
            transition: all 0.2s;
        }
        .tab.active {
            background: #2563eb;
            color: #ffffff;
        }

        .content {
            padding: 16px;
            display: none;
        }
        .content.active {
            display: block;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #94a3b8;
            margin: 16px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .card {
            background: #1e1e1e;
            border: 1px solid #2e2e2e;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .card.past-card {
            opacity: 0.65;
            border-color: #262626;
            background: #181818;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            margin-bottom: 8px;
            color: #f3f4f6;
            font-size: 15px;
        }
        .deadline-badge {
            background: #3b82f622;
            color: #60a5fa;
            border: 1px solid #3b82f644;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .deadline-badge.expired {
            background: #ef444422;
            color: #f87171;
            border-color: #ef444444;
        }

        .card-body {
            font-size: 14px;
            line-height: 1.4;
            color: #d1d5db;
            white-space: pre-wrap;
            margin-top: 6px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        input[type="text"], textarea, input[type="date"] {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #3d3d3d;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 14px;
            outline: none;
        }
        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 6px;
        }
        .btn-toggle {
            background: #334155;
            color: #cbd5e1;
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            cursor: pointer;
        }

        .admin-zone {
            display: none;
            background: #1e293b;
            padding: 14px;
            border-radius: 12px;
            margin-top: 16px;
            border: 1px dashed #f59e0b;
        }
        .admin-zone h3 {
            margin-top: 0;
            font-size: 14px;
            color: #f59e0b;
            margin-bottom: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-box {
            background: #1e1e1e;
            padding: 20px;
            width: 85%;
            max-width: 340px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #3d3d3d;
            margin: auto;
        }
        .log-item {
            font-size: 12px;
            border-bottom: 1px solid #2a2a2a;
            padding: 8px 0;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <!-- Шапка статуса -->
    <div class="user-status-bar">
        <span>ID: <strong id="debug-user-id">Определяется...</strong></span>
        <span id="debug-role-badge" class="status-badge">Загрузка...</span>
    </div>

    <!-- Навигационные вкладки -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('hw', this)">Общее ДЗ</div>
        <div class="tab" onclick="switchTab('session', this)">Сессия</div>
        <div class="tab" onclick="switchTab('logs', this)">Логи</div>
    </div>

    <!-- Вкладка: Общее ДЗ -->
    <div id="hw" class="content active">
        <div class="controls-bar">
            <div></div>
            <!-- Кнопка скрытия/показа панели редактора -->
            <button id="toggle-editor-btn" class="btn-toggle" style="display:none;" onclick="toggleEditorPanel()">👁️ Скрыть панель</button>
        </div>

        <!-- Раздел 1: Ближайшие ДЗ -->
        <div class="section-title">📌 Ближайшие задания</div>
        <div id="hw-upcoming-list">Загрузка...</div>

        <!-- Раздел 2: Прошедшие ДЗ -->
        <div class="section-title" style="margin-top: 24px;">⌛ Прошедшие задания</div>
        <div id="hw-past-list">Загрузка...</div>

        <!-- Панель добавления/редактирования ДЗ -->
        <div id="admin-add-hw" class="admin-zone">
            <h3 id="form-title">➕ Панель редактора (Добавить ДЗ)</h3>
            <input type="hidden" id="hw-id">
            <input type="text" id="hw-subject" placeholder="Предмет (например: Высшая математика)">
            <input type="text" id="hw-deadline" placeholder="Срок сдачи (ДД.ММ.ГГГГ)" value="25.09.2026">
            <textarea id="hw-desc" placeholder="Описание задания / параграф / задачи"></textarea>
            <div style="display: flex; gap: 8px;">
                <button class="btn" id="btn-save-hw" onclick="askConfirmAdd('dz')">Сохранить задание</button>
                <button class="btn btn-toggle" id="btn-cancel-edit" style="display:none;" onclick="resetForm()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Вкладка: Сессия -->
    <div id="session" class="content">
        <h2>🎓 Зачеты и экзамены</h2>
        <div id="session-list">Загрузка...</div>

        <div id="admin-add-session" class="admin-zone">
            <h3>➕ Добавить экзамен / зачет</h3>
            <input type="text" id="session-subject" placeholder="Предмет">
            <input type="text" id="session-deadline" placeholder="Дата экзамена (ДД.ММ.ГГГГ)">
            <textarea id="session-desc" placeholder="Кабинет, время, требования"></textarea>
            <button class="btn" onclick="askConfirmAdd('session')">Сохранить в сессию</button>
        </div>
    </div>

    <!-- Вкладка: Логи -->
    <div id="logs" class="content">
        <h2>📜 История действий (Audit Log)</h2>
        <div id="logs-list">Загрузка логов...</div>
    </div>

    <!-- Модальное окно подтверждения -->
    <div id="confirmModal" class="modal">
        <div class="modal-box">
            <h3 style="margin-bottom: 8px;">⚠️ Подтверждение</h3>
            <p id="modal-text" style="font-size: 14px; color: #ccc;">Вы уверены?</p>
            <div style="display:flex; gap:10px; margin-top:16px;">
                <button class="btn" onclick="executePendingAction()">Да</button>
                <button class="btn btn-danger" style="margin-top:0; width:100%;" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        const BACKEND_URL = "https://tdr26-backend.onrender.com"; 

        const userId = tg?.initDataUnsafe?.user?.id || new URLSearchParams(window.location.search).get('user_id') || 123456789;
        const username = tg?.initDataUnsafe?.user?.username || tg?.initDataUnsafe?.user?.first_name || "student";

        let canEdit = false;
        let pendingAction = null;
        let isPanelVisible = true;
        let rawHomeworkData = [];

        document.getElementById('debug-user-id').innerText = userId;

        // Инициализация при запуске
        async function init() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/user_info?user_id=${userId}`);
                if (res.ok) {
                    const data = await res.json();
                    canEdit = data.can_edit;
                    
                    const badge = document.getElementById('debug-role-badge');
                    badge.innerText = data.role.toUpperCase();
                    if (canEdit) {
                        if (data.role === 'superadmin') badge.classList.add('admin');
                        else badge.classList.add('editor');
                        
                        document.querySelectorAll('.admin-zone').forEach(el => el.style.display = 'block');
                        document.getElementById('toggle-editor-btn').style.display = 'inline-block';
                    }
                } else {
                    document.getElementById('debug-role-badge').innerText = "VIEWER";
                }
            } catch(e) {
                console.error("Ошибка подключения:", e);
                document.getElementById('debug-role-badge').innerText = "OFFLINE";
            }

            loadHW();
            loadSession();
            loadLogs();
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        function toggleEditorPanel() {
            isPanelVisible = !isPanelVisible;
            document.querySelectorAll('.admin-zone').forEach(el => {
                el.style.display = isPanelVisible ? 'block' : 'none';
            });
            document.getElementById('toggle-editor-btn').innerText = isPanelVisible ? '👁️ Скрыть панель' : '✏️ Показать панель';
        }

        // Парсинг даты из формата "ДД.ММ.ГГГГ" или "ГГГГ-ММ-ДД"
        function parseDateString(str) {
            if (!str) return new Date(0);
            if (str.includes('.')) {
                const parts = str.split('.');
                if (parts.length === 3) {
                    return new Date(parts[2], parts[1] - 1, parts[0]);
                }
            }
            return new Date(str);
        }

        // Загрузка и распределение ДЗ (Ближайшие / Прошедшие)
        async function loadHW() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/homework?type=dz`);
                rawHomeworkData = await res.json();
                
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const upcoming = [];
                const past = [];

                rawHomeworkData.forEach(item => {
                    // item: [id, subject, deadline, description] или объект
                    const deadlineStr = Array.isArray(item) ? item[2] : item.deadline;
                    const itemDate = parseDateString(deadlineStr);

                    if (itemDate >= today) {
                        upcoming.push(item);
                    } else {
                        past.push(item);
                    }
                });

                // Ближайшие: сначала самые срочные
                upcoming.sort((a, b) => parseDateString(Array.isArray(a)?a[2]:a.deadline) - parseDateString(Array.isArray(b)?b[2]:b.deadline));
                // Прошедшие: сначала недавно завершенные
                past.sort((a, b) => parseDateString(Array.isArray(b)?b[2]:b.deadline) - parseDateString(Array.isArray(a)?a[2]:a.deadline));

                renderCards('hw-upcoming-list', upcoming, false);
                renderCards('hw-past-list', past, true);

            } catch(e) {
                console.error("Ошибка загрузки ДЗ:", e);
                document.getElementById('hw-upcoming-list').innerHTML = '<div style="color:#ef4444;">Ошибка загрузки ДЗ</div>';
            }
        }

        function renderCards(containerId, list, isPast) {
            const container = document.getElementById(containerId);
            if (list.length === 0) {
                container.innerHTML = `<div style="color:#666; font-size:12px; padding:8px 0;">${isPast ? 'Прошедших заданий нет' : 'Предстоящих заданий нет'}</div>`;
                return;
            }

            let html = '';
            list.forEach(item => {
                const id = Array.isArray(item) ? item[0] : item.id;
                const subject = Array.isArray(item) ? item[1] : item.subject;
                const deadline = Array.isArray(item) ? item[2] : item.deadline;
                const desc = Array.isArray(item) ? item[3] : item.description;

                html += `<div class="card ${isPast ? 'past-card' : ''}">
                    <div class="card-header">
                        <span>📚 ${escapeHtml(subject)}</span>
                        <span class="deadline-badge ${isPast ? 'expired' : ''}">${isPast ? '⌛ Сдано:' : '⏳ До:'} ${deadline}</span>
                    </div>
                    <div class="card-body">${escapeHtml(desc)}</div>
                    ${canEdit ? `
                        <div class="card-actions">
                            <button class="btn btn-sm btn-toggle" onclick="startEditHW(${id}, '${escapeHtml(subject)}', '${deadline}', '${escapeHtml(desc)}')">✏️ Изменить</button>
                            <button class="btn btn-sm btn-danger" onclick="askConfirmDelete(${id})">🗑️ Удалить</button>
                        </div>
                    ` : ''}
                </div>`;
            });
            container.innerHTML = html;
        }

        async function loadSession() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/homework?type=session`);
                const data = await res.json();
                let html = '';
                if (data.length === 0) {
                    html = '<div style="color:#888; text-align:center; padding:20px;">Информация о сессии не добавлена</div>';
                } else {
                    data.forEach(item => {
                        const id = Array.isArray(item) ? item[0] : item.id;
                        const subject = Array.isArray(item) ? item[1] : item.subject;
                        const deadline = Array.isArray(item) ? item[2] : item.deadline;
                        const desc = Array.isArray(item) ? item[3] : item.description;

                        html += `<div class="card">
                            <div class="card-header">
                                <span>🎓 ${escapeHtml(subject)}</span>
                                <span class="deadline-badge">📅 ${deadline}</span>
                            </div>
                            <div class="card-body">${escapeHtml(desc)}</div>
                            ${canEdit ? `<button class="btn btn-danger btn-sm" style="margin-top:8px;" onclick="askConfirmDelete(${id})">Удалить</button>` : ''}
                        </div>`;
                    });
                }
                document.getElementById('session-list').innerHTML = html;
            } catch(e) {
                document.getElementById('session-list').innerHTML = 'Ошибка загрузки сессии';
            }
        }

        async function loadLogs() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/logs?user_id=${userId}`);
                if (!res.ok) {
                    document.getElementById('logs-list').innerHTML = '<div style="color:#888;">Просмотр логов ограничен</div>';
                    return;
                }
                const data = await res.json();
                let html = '';
                data.forEach(l => {
                    html += `<div class="log-item"><strong>@${l[0]}</strong>: ${l[1]} <br><span style="color:#666; font-size:10px;">${l[2]}</span></div>`;
                });
                document.getElementById('logs-list').innerHTML = html || 'Логи пусты';
            } catch(e) {
                document.getElementById('logs-list').innerHTML = 'Ошибка загрузки логов';
            }
        }

        // Заполнение формы для редактирования
        function startEditHW(id, subject, deadline, desc) {
            document.getElementById('hw-id').value = id;
            document.getElementById('hw-subject').value = subject;
            document.getElementById('hw-deadline').value = deadline;
            document.getElementById('hw-desc').value = desc;
            
            document.getElementById('form-title').innerText = "✏️ Редактирование ДЗ";
            document.getElementById('btn-save-hw').innerText = "Сохранить изменения";
            document.getElementById('btn-cancel-edit').style.display = "inline-block";
            
            // Прокрутка к форме
            document.getElementById('admin-add-hw').scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('hw-id').value = '';
            document.getElementById('hw-subject').value = '';
            document.getElementById('hw-desc').value = '';
            document.getElementById('form-title').innerText = "➕ Панель редактора (Добавить ДЗ)";
            document.getElementById('btn-save-hw').innerText = "Сохранить задание";
            document.getElementById('btn-cancel-edit').style.display = "none";
        }

        function askConfirmAdd(type) {
            const prefix = type === 'dz' ? 'hw' : 'session';
            const hwId = document.getElementById(`${prefix}-id`)?.value || null;
            const subject = document.getElementById(`${prefix}-subject`).value;
            const deadline = document.getElementById(`${prefix}-deadline`).value;
            const description = document.getElementById(`${prefix}-desc`).value;

            if (!subject || !deadline || !description) {
                alert("Заполните все поля!");
                return;
            }

            pendingAction = async () => {
                await fetch(`${BACKEND_URL}/api/homework/add?user_id=${userId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: hwId, subject, deadline, description, type, user_id: userId, username })
                });
                resetForm();
                if (type === 'dz') loadHW(); else loadSession();
                loadLogs();
            };

            document.getElementById('modal-text').innerText = `${hwId ? 'Сохранить изменения в' : 'Добавить'} ${type === 'dz' ? 'ДЗ' : 'экзамен'} по предметь "${subject}"?`;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function askConfirmDelete(hwId) {
            pendingAction = async () => {
                await fetch(`${BACKEND_URL}/api/homework/delete?user_id=${userId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ hw_id: hwId, user_id: userId, username })
                });
                loadHW();
                loadSession();
                loadLogs();
            };
            document.getElementById('modal-text').innerText = "Удалить эту запись?";
            document.getElementById('confirmModal').style.display = 'flex';
        }

        function executePendingAction() {
            if (pendingAction) pendingAction();
            closeModal();
        }

        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        init();
    </script>
</body>
</html>
