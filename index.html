<!-- index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТДР-26 МГРИ</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #1e1e1e);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0; padding: 0;
        }
        .tabs { display: flex; background: var(--tg-theme-secondary-bg-color, #2c2c2c); padding: 10px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 8px; }
        .tab.active { background: var(--tg-theme-button-color, #2a82f6); color: var(--tg-theme-button-text-color, #fff); }
        .content { padding: 20px; display: none; }
        .content.active { display: block; }
        .card { background: var(--tg-theme-secondary-bg-color, #2c2c2c); padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        .edit-btn { background: #ffaa00; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; float: right; display: none; }

        /* Модальное окно подтверждения */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); }
        .modal-content { background: var(--tg-theme-bg-color, #1e1e1e); margin: 50% auto; padding: 20px; width: 80%; border-radius: 10px; text-align: center; }
        .btn-confirm { background: red; color: white; border: none; padding: 10px; margin: 5px; border-radius: 5px; }
        .btn-cancel { background: gray; color: white; border: none; padding: 10px; margin: 5px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('hw')">Общее ДЗ</div>
        <div class="tab" onclick="switchTab('schedule')">Расписание</div>
        <div class="tab" onclick="switchTab('session')">Сессия</div>
    </div>

    <!-- Вкладка ДЗ -->
    <div id="hw" class="content active">
        <h2>Дедлайны</h2>
        <div class="card">
            <button class="edit-btn" onclick="showConfirm()">✏️ Редактировать</button>
            <strong>Математика</strong><br>
            Срок: 21.09.2026<br>
            Сделать пределы, номера 1-15.
        </div>
    </div>

    <!-- Вкладка Расписание -->
    <div id="schedule" class="content">
        <h2>Расписание (MMIS)</h2>
        <input type="date" style="padding: 10px; width: 90%; margin-bottom: 15px; border-radius: 5px;" value="2026-09-21">
        <div class="card">
            <strong>1 пара (09:00 - 10:30)</strong><br>
            Физические процессы нефтегазового производства
        </div>
    </div>

    <!-- Вкладка Сессия -->
    <div id="session" class="content">
        <h2>Сессия и Долги</h2>
        <p>Здесь будут даты экзаменов.</p>
    </div>

    <!-- Модальное окно подтверждения -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <p>Вы уверены, что хотите изменить это задание?</p>
            <button class="btn-confirm" onclick="closeConfirm()">Да, изменить</button>
            <button class="btn-cancel" onclick="closeConfirm()">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Открывает окно на весь экран

        // Переключение вкладок
        function switchTab(tabId) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Логика модального окна для админов
        function showConfirm() { document.getElementById('confirmModal').style.display = 'block'; }
        function closeConfirm() { document.getElementById('confirmModal').style.display = 'none'; }
    </script>
</body>
</html>
